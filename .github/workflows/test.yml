name: Engine Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fai-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fai-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (renderer)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Type check (Electron main process)
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: Run engine test suite
        run: npm test
